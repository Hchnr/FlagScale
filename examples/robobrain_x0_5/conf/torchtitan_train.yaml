defaults:
  - _self_
  - train: libero_qwengroot

experiment:
  exp_name: libero_qwengroot_torchtitan
  seed: 42
  save_steps: 10000
  load: null
  exp_dir: outputs/${experiment.exp_name}
  ckpt_format: torch
  task:
    type: train
    backend: native
    # 改为使用torchtitan脚本
    entrypoint: flagscale/train/torchtitan_robobrain_x0.5_qwengroot.py
  runner:
    per_node_task: false
    no_shared_fs: false
    rdzv_backend: static
    hostfile: null
  cmds:
    before_start: echo "Starting RoboBrain-x0.5 Training with TorchTitan"
  envs:
    LOGLEVEL: "INFO"
    CUDA_VISIBLE_DEVICES: 0,1,2,3
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    WANDB_MODE: offline
    # TorchTitan特定环境变量
    TORCH_NCCL_BLOCKING_WAIT: "1"
    NCCL_DEBUG: "WARN"

# TorchTitan并行配置
trainer:
  # 并行度设置 - 支持张量并行（TP）
  parallelism:
    data_parallel_degree: 2        # 2卡数据并行
    tensor_parallel_degree: 2      # 2卡张量并行（支持模型并行）
    pipeline_parallel_degree: 1    # 管道并行（暂不使用）
  
  # 内存优化
  activation_checkpointing: true   # 启用激活值检查点
  max_grad_norm: 1.0              # 梯度裁剪
  enable_gradient_checkpointing: true  # 启用梯度检查点
  
  # FSDP配置
  sharding_strategy: "FULL_SHARD"  # FULL_SHARD或SHARD_GRAD_OP
  cpu_offload: false              # CPU卸载
  
  # 学习率配置（分层学习率）
  learning_rate:
    base: 3.0e-5                  # 默认学习率
    qwen_vl_interface: 1.0e-5     # 视觉-语言接口学习率
    action_model: 1.0e-4          # 动作头学习率
  
  # 优化器配置
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  
  # 学习率调度器
  lr_scheduler_type: cosine_with_min_lr
  num_warmup_steps: 3600
  max_train_steps: 36000
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  
  # 数据加载
  num_workers: 4                  # 增加worker数以提高数据加载速度
  prefetch_factor: 2
  
  # 混合精度训练
  enable_mixed_precision_training: true

# 数据配置
batch_size: 2                     # 单卡批次大小（支持TP时更小的批次）
shuffle_buffer_size: null
shuffle_over_epochs_multiplier: -1

# 训练配置
log_freq: 10
train_steps: 36000                # 总训练步数
save_steps: 3600                  # 保存间隔
trackers: [jsonl, wandb]          # 日志跟踪器

# 日志和检查点
checkpoint_dir: ./outputs/libero_qwengroot/checkpoints/ckpt_out
output_directory: ./outputs/libero_qwengroot/checkpoints/ckpt_out
resume: false                     # 是否恢复训练

# W&B配置
wandb_enabled: false
wandb_entity: flagscale
project_name: robobrain_x0.5
exp_name: robobrain_x0.5_torchtitan

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
